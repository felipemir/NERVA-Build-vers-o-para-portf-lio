name: Importar NERVA Build do pacote revisado

on:
  push:
    paths:
      - 'NERVA-Build-Portfolio.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar e extrair pacote
        shell: bash
        run: |
          set -euo pipefail
          test -f NERVA-Build-Portfolio.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('NERVA-Build-Portfolio.zip')
          with ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)), 'Nomes duplicados no pacote'
              assert all(not p.startswith('/') and '..' not in Path(p).parts and not p.startswith('.git/') for p in names), 'Caminho inseguro no pacote'
              assert all(info.file_size < 1024 * 1024 for info in z.infolist()), 'Arquivo grande demais'
              z.extractall('.')
          PY
          rm -f NERVA-Build-Portfolio.zip
          # README principal com introducao e link para detalhes do portfólio
          cat > README.md <<'EOF'
          # NERVA Build — Backend (portfólio)

          MVP experimental para catálogo, pedidos e estoque de lojas de materiais de construção. Projeto histórico pausado; **não é software de produção**.

          **Tecnologias:** Java 21, Spring Boot, Spring Security, JWT, PostgreSQL, JPA, Flyway e Maven.

          Desenvolvido em equipe; minha contribuição concentrou-se principalmente no backend, no entendimento do domínio e na implementação de regras de negócio.

          Consulte [PORTFOLIO.md](PORTFOLIO.md) para problema, decisões técnicas, participação, limitações e o que melhoraria hoje. O arquivo [readme.md](readme.md) contém a documentação técnica original do MVP.

          **Limites:** a visão futura de IA e medição por câmera não foi implementada neste backend. Credenciais de seed são exclusivamente demonstrativas e inseguras para produção. Configure `APP_JWT_SECRET` antes de executar a API.
          EOF
          git rm -f --ignore-unmatch .github/workflows/import-portfolio.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "feat: importa backend NERVA Build revisado para portfólio"
          git push
